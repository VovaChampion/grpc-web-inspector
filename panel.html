<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div id="toolbar">
      <span id="status" class="status">Attaching…</span>
      <div class="spacer"></div>
      <label class="filter-label">
        <input type="checkbox" id="autoscroll" checked />
        Autoscroll
      </label>
      <button id="clear-btn">Clear</button>
    </div>

    <div id="layout">
      <div id="call-list"></div>
      <div id="detail">
        <div id="empty-state">Select a call to inspect its frames.</div>
      </div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
