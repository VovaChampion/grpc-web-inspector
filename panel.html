<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div id="toolbar">
      <span id="status" class="status">Attaching…</span>
      <div class="spacer"></div>
      <label class="filter-label proto-loader" for="proto-file" title="Select the folder containing your .proto schema (and everything it depends on) — e.g. a buf export output directory">
        <input type="file" id="proto-file" accept=".proto" multiple webkitdirectory style="display: none" />
        <span id="proto-label">Load .proto</span>
      </label>
      <label class="filter-label">
        <input type="checkbox" id="autoscroll" checked />
        Autoscroll
      </label>
      <div class="view-toggle" id="view-toggle">
        <button id="view-tree-btn" class="view-btn active" data-mode="tree">Tree</button>
        <button id="view-json-btn" class="view-btn" data-mode="json">JSON</button>
      </div>
      <button id="expand-btn">Expand all</button>
      <button id="collapse-btn">Collapse all</button>
      <button id="clear-btn">Clear</button>
    </div>

    <div id="layout">
      <div id="call-list"></div>
      <div id="detail">
        <div id="empty-state">Select a call to inspect its frames.</div>
      </div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
